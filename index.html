<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MSPACE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <h1>MSPACE</h1>
      <p>Entrar a Home</p>

      <input 
        type="password" 
        id="password" 
        placeholder="Introduce la contraseña"
      >

      <button onclick="verificar()">Entrar</button>

      <span class="error" id="error-msg"></span>
    </div>
  </div>

  <script>
    function verificar() {
      const correcta = "IJ<3M";
      const entrada = document.getElementById("password").value;
      const error = document.getElementById("error-msg");

      if (entrada === correcta) {
        window.location.href = "home.html";
      } else {
        error.textContent = "✨Esa no es, Mensa :3✨​";
      }
    }
  </script>

</body>
</html>
